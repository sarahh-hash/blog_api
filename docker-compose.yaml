services:
  db:
    image: postgres:16
    container_name: blog_db
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: blog_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: blog
      DB_USER: blog
      DB_PASSWORD: blog
      DB_HOST: db
      DB_PORT: 5432

volumes:
  pgdata: